# Local-only app: listens on this PC only, no usage statistics sent.
[server]
address = "localhost"
port = 8501
headless = false
maxUploadSize = 200
fileWatcherType = "none"

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1a73e8"          # blue: red is reserved for errors
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f8"
textColor = "#202124"
